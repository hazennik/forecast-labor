name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # Add PostgreSQL service for integration tests
    # X-13 is built below and used by the golden diagnostics quality gate.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: forecast_labor
          POSTGRES_PASSWORD: forecast_labor
          POSTGRES_DB: forecast_labor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    strategy:
      matrix:
        python-version: ["3.11"]
    
    env:
      # Configure registry to use PostgreSQL for integration tests
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: forecast_labor
      POSTGRES_USER: forecast_labor
      POSTGRES_PASSWORD: forecast_labor
      X13_CI_IMAGE: forecast-labor-x13:ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate test vintages (CI only)
        run: |
          python scripts/setup_test_data.py
        # NOTE: Vintages are gitignored (/data/) to keep repo clean.
        # CI generates deterministic test vintages (seed=42) ONLY.
        # Baselines are FROZEN in git (tests/fixtures/golden_baselines/).
        # Verification compares current vintages against frozen baseline.
        # This allows the gate to detect regressions.
        # 
        # To update baselines (after legitimate code changes):
        #   Run locally: make regenerate-baselines
        #   Commit updated baseline files
        # 
        # Production should use real ETL outputs, not these synthetic vintages.
      
      - name: Build X-13 CI image
        run: |
          docker build -t "${X13_CI_IMAGE}" -f infra/x13/Dockerfile infra/x13/
      
      - name: Verify X-13 CI image
        run: |
          docker run --rm "${X13_CI_IMAGE}" x13as -v
      
      - name: Initialize PostgreSQL schema
        run: |
          # Wait for Postgres to be fully ready
          until pg_isready -h localhost -p 5432 -U forecast_labor; do
            echo "Waiting for Postgres..."
            sleep 2
          done
          
          # Initialize feature registry schema
          PGPASSWORD=forecast_labor psql -h localhost -p 5432 -U forecast_labor -d forecast_labor -f infra/postgres/feature_registry_schema.sql
        # NOTE: This initializes the feature registry database schema
        # Integration tests in tests/integration/ now run against real Postgres
        # This validates the database backend is functional in CI
      
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .
      
      - name: Type check with mypy
        run: |
          pip install mypy
          mypy etl/ seasonal/ features/ --ignore-missing-imports
      
      - name: Run all tests (including Postgres integration tests)
        run: |
          pytest tests/ -v --tb=short --maxfail=10
        # All tests run without filtering, including:
        # - Unit tests (305+ tests)
        # - Integration tests with real PostgreSQL (8 tests)
        # Feature registry database backend is now validated in CI
      
      - name: Generate coverage report
        run: |
          pytest tests/ --cov=etl --cov=seasonal --cov=features --cov=validators --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
      
      - name: Verify vintage determinism
        run: |
          python scripts/verify_vintage_determinism.py --vintage-date 2024-01-15 --verify
        # NOTE: This gate will block merges if vintage data has changed unexpectedly
        # To populate baselines initially: python scripts/verify_vintage_determinism.py --vintage-date 2024-01-15 --record
      
      - name: Check golden diagnostics (X-13 Quality Gate)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e PYTHONPATH=/app \
            -e POSTGRES_HOST=host.docker.internal \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=forecast_labor \
            -e POSTGRES_USER=forecast_labor \
            -e POSTGRES_PASSWORD=forecast_labor \
            --add-host=host.docker.internal:host-gateway \
            "${X13_CI_IMAGE}" \
            python3 scripts/record_golden_diagnostics.py \
              --vintage-date 2024-01-15 \
              --verify \
              --force-synthetic \
              --output-file tests/fixtures/golden_baselines/golden_seasonal_diagnostics_ci.json
        # This gate runs real X-13ARIMA-SEATS inside the CI image, computes M1-M11
        # and Q-statistics, and compares fresh diagnostics with the committed CI baseline.
        # To populate baselines: python scripts/record_golden_diagnostics.py --vintage-date 2024-01-15 --record
      
      - name: Test summary
        if: always()
        run: |
          echo "Test run completed"
          echo "Check the Actions tab for detailed results"

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install linting tools
        run: |
          pip install black ruff mypy
      
      - name: Check code formatting (black)
        run: |
          black --check .
      
      - name: Lint with ruff
        run: |
          ruff check . --statistics
      
      - name: Type check with mypy
        run: |
          mypy etl/ seasonal/ features/ --ignore-missing-imports

