[pytest]
# Pytest configuration for forecast-labor testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.4

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may require services)
    slow: Tests that take significant time (> 1 second)
    etl: ETL pipeline tests
    seasonal: Seasonal adjustment tests
    validator: Data validation tests
    determinism: Reproducibility and determinism tests
    golden: Golden baseline comparison tests
    requires_docker: Tests requiring Docker services
    requires_network: Tests requiring network access (should be mocked in CI)

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Coverage options (when running with --cov)
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    # Warnings
    -W error::DeprecationWarning
    -W error::PendingDeprecationWarning
    # Capture output (show print statements only on failure)
    --capture=no
    # Show durations of slowest tests
    --durations=10
    # Fail on first error (uncomment for faster debugging)
    # -x
    # Parallel execution (uncomment when stable)
    # -n auto

# Coverage configuration
[coverage:run]
source = etl,seasonal,features,models_src,backtests,subnets
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */scripts/*
    */infra/*
    */agents_src/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract

[coverage:html]
directory = htmlcov

# Test timeouts (prevent hanging tests)
timeout = 300
timeout_method = thread

# Logging configuration for tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

